# ==========================================
# SmartPOS - Local Development Configuration
# ==========================================

# Backend accepts connections from this computer only
server.address=127.0.0.1

# ==========================================
# Demo Employee Accounts
# ==========================================

smartpos.demo.admin-email=${SMARTPOS_ADMIN_EMAIL:}
smartpos.demo.admin-password=${SMARTPOS_ADMIN_PASSWORD:}

smartpos.demo.cashier-email=${SMARTPOS_CASHIER_EMAIL:}
smartpos.demo.cashier-password=${SMARTPOS_CASHIER_PASSWORD:}

# ==========================================
# Debug Logging
# ==========================================

logging.level.org.springframework.security=DEBUG
logging.level.com.smartpos.backend=DEBUG

# Show error message during local development
server.error.include-message=always

logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE